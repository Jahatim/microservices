server:
  port: 9000
spring:
  application:
    name: "cards"
  #  config:
  #    import: "optional:configserver:http://localhost:8071"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3306/devdb
    username: root
    password: root
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true
    prometheus:
      enabled: true

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8070/eureka/
    register-with-eureka: true
    fetch-registry: true

info:
  app:
    name: "Tim Bank Cars MS"
    description: "Tim Bank cards micro-service"
    version: "1.0"
logging:
  level:
    com:
      eazybytes:
        cards: INFO
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}] [%t] %d{yyyy-MM-dd HH:mm:ss.SSS}"
