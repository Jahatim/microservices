server:
  port: 9000
spring:
  application:
    name: "cards"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3306/devdb
    username: root
    password: root
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8070/eureka/
    register-with-eureka: true
    fetch-registry: true

info:
  app:
    name: "Tim Bank Cars MS"
    description: "Tim Bank cards micro-service"
    version: "1.0"