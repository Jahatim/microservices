server:
  port: 8090
spring:
  application:
    name: "loans"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3306/devdb
    username: root
    password: root
#  config:
#    import: "optional:configserver:http://localhost:8071"
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    shutdown:
      enabled: true
    prometheus:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8070/eureka/
info:
  app:
    name: "Tim Bank Loans MS"
    description: "Tim Bank loans micro-service"
    version: 1.0

logging:
  level:
    com:
      eazybytes:
        loans: INFO
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}] [%t] %d{yyyy-MM-dd HH:mm:ss.SSS}"
